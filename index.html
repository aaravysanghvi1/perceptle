<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perceptle</title>
<style>
  :root { --bg:#0c1014; --ink:#e6edf3; --dim:rgba(230,237,243,.55); --faint:rgba(230,237,243,.16); --sig:#2ed9ff; --ok:#4bd88a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; max-width:820px; padding:14px 16px; display:flex; justify-content:space-between; font:600 14px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.15em; color:var(--dim); }
  main { width:100%; max-width:820px; padding:0 16px 32px; }
  canvas { width:100%; aspect-ratio:8/5; background:#0f151b; border:1px solid var(--faint); border-radius:8px; touch-action:none; display:block; }
  .card { text-align:center; padding:40px 8px; }
  .card h1 { font:700 40px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.12em; margin:0 0 8px; }
  .tag { font:13px ui-monospace,Menlo,Consolas,monospace; color:var(--dim); letter-spacing:.1em; margin-bottom:12px; }
  .card p { max-width:520px; margin:12px auto 24px; line-height:1.5; color:var(--dim); }
  button { font:600 16px system-ui; padding:10px 28px; border-radius:8px; border:1px solid var(--faint); background:transparent; color:var(--ink); cursor:pointer; margin:4px; }
  button.primary { background:var(--sig); color:#06222b; border-color:var(--sig); }
  .total { font:700 72px ui-monospace,Menlo,Consolas,monospace; }
  .total small { font-size:32px; color:var(--sig); margin-left:12px; }
  .row { display:grid; grid-template-columns:2em 5em 1fr 3em 2em; gap:8px; padding:8px 0; border-bottom:1px solid var(--faint); text-align:left; font:14px ui-monospace,Menlo,Consolas,monospace; }
  .row .h { color:var(--dim); }
  #count-form { position:absolute; }
  .over { margin-top:12px; text-align:center; min-height:40px; color:var(--dim); font:14px ui-monospace,Menlo,Consolas,monospace; }
  input[type=text] { font:600 24px ui-monospace,monospace; width:5em; text-align:center; padding:8px; border-radius:8px; border:1px solid var(--faint); background:#0f151b; color:var(--ink); }
  .toast { position:fixed; bottom:20px; background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; }
</style>
</head>
<body>
<header><span>PERCEPTLE</span><span id="no"></span></header>
<main>
  <div id="screen"></div>
  <div id="stagewrap" hidden>
    <canvas id="cv" width="1600" height="1000"></canvas>
    <div class="over" id="over"></div>
  </div>
</main>
<script>
"use strict";
// ---- seeded daily randomness (own implementation: mulberry32 + string hash) ----
function hashStr(s){ let h=2166136261>>>0; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h; }
function rng(seed){ let a=hashStr(seed); return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const R = (r,a,b)=>a+(b-a)*r();
const RI = (r,a,b)=>Math.floor(R(r,a,b+1));

const W=800,H=500;
const cv=document.getElementById('cv'), g=cv.getContext('2d'); g.scale(2,2);
const $=id=>document.getElementById(id);
const screen=$('screen'), wrap=$('stagewrap'), over=$('over');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frame=()=>new Promise(r=>requestAnimationFrame(r));
const clear=()=>{ g.clearRect(0,0,W,H); };
function text(t,x,y,o={}){ g.save(); g.font=`${o.w||500} ${o.s||16}px ui-monospace,Menlo,Consolas,monospace`; g.fillStyle=o.c||'#e6edf3'; g.textAlign=o.a||'center'; g.textBaseline='middle'; g.fillText(t,x,y); g.restore(); }
function toLogical(e){ const b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)/b.width*W, y:(e.clientY-b.top)/b.height*H}; }

const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const EPOCH=Date.UTC(2026,0,1);
const puzzleNo=k=>{ const [y,m,d]=k.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d)-EPOCH)/864e5)+1; };

// score: 100 at zero error, Gaussian falloff
const score=(err,sigma)=>Math.round(100*Math.exp(-.5*(err/sigma)**2));
const grade=s=>s>=95?'S':s>=85?'A':s>=70?'B':s>=55?'C':s>=40?'D':'F';

let audio=null;
function beep(when,freq=1000,gain=.4){ if(!audio) return; const o=audio.createOscillator(), v=audio.createGain(); o.frequency.value=freq; v.gain.setValueAtTime(1e-4,when); v.gain.exponentialRampToValueAtTime(gain,when+.003); v.gain.exponentialRampToValueAtTime(1e-4,when+.04); o.connect(v); v.connect(audio.destination); o.start(when); o.stop(when+.06); }

function say(msg){ over.textContent=msg; }
function showStage(){ screen.hidden=true; wrap.hidden=false; }
function showScreen(node){ wrap.hidden=true; screen.hidden=false; screen.replaceChildren(node); }
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

// ---- the five events ----
const events=[
 { id:'count', emoji:'🔢', name:'Count', sigma:.2,
   intro:'Dots will flash for two seconds. How many were there?',
   make(r){ const n=RI(r,40,85), pts=[]; while(pts.length<n){ const p={x:R(r,60,740),y:R(r,60,440)}; if(pts.every(q=>(q.x-p.x)**2+(q.y-p.y)**2>300)) pts.push(p); } return {n,pts}; },
   async run(p){
     for(const s of ['3','2','1']){ clear(); text(s,400,250,{s:120,w:600}); await sleep(650); }
     clear(); g.fillStyle='#e6edf3'; for(const d of p.pts){ g.beginPath(); g.arc(d.x,d.y,5,0,7); g.fill(); }
     await sleep(2000); clear();
     const guess=await new Promise(res=>{ const f=el('form'); f.id='count-form'; f.innerHTML='<input id="ci" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Dot count"> <button class="primary" type="submit">Submit</button>'; over.replaceChildren(f); const i=f.querySelector('input'); i.focus(); f.onsubmit=e=>{ e.preventDefault(); const v=parseInt(i.value,10); if(Number.isFinite(v)&&v>=0){ over.textContent=''; res(v);} }; });
     const err=Math.abs(guess-p.n)/p.n;
     clear(); text(String(p.n),400,230,{s:110,c:'#4bd88a',w:600}); text(`you said ${guess}`,400,320,{s:24,c:'#2ed9ff'}); await sleep(1800);
     return {err, human: guess===p.n?'exactly right':`off by ${Math.abs(guess-p.n)}`};
   }},
 { id:'predict', emoji:'🎯', name:'Track', sigma:60,
   intro:'Watch the ball. When it disappears, click where it will land.',
   make(r){ for(;;){ const g_=900, x0=R(r,60,140), sp=R(r,520,650), an=R(r,50,70)*Math.PI/180, vx=sp*Math.cos(an), vy=sp*Math.sin(an), T=2*vy/g_, land=x0+vx*T; if(land>=450&&land<=760&&T<2) return {x0,vx,vy,T,g:g_,land}; } },
   async run(p){
     const Y=450, pos=t=>({x:p.x0+p.vx*t, y:Y-(p.vy*t-.5*p.g*t*t)});
     const hideAt=.45*p.T*1000;
     return await new Promise(res=>{
       const t0=performance.now(); let done=false;
       const click=e=>{ if(done||performance.now()-t0<hideAt+80) return; done=true; cv.removeEventListener('pointerdown',click); const x=Math.max(0,Math.min(W,toLogical(e).x)); res({x}); };
       cv.addEventListener('pointerdown',click);
       const tick=()=>{ if(done) return; const t=performance.now()-t0; clear(); g.strokeStyle='#8a949c'; g.lineWidth=2; g.beginPath(); g.moveTo(0,Y); g.lineTo(W,Y); g.stroke();
         if(t<hideAt){ const q=pos(t/1000); g.fillStyle='#e6edf3'; g.beginPath(); g.arc(q.x,q.y,7,0,7); g.fill(); } else text('Click where it lands',400,60,{s:16,c:'rgba(230,237,243,.55)'});
         requestAnimationFrame(tick); }; tick();
     }).then(async({x})=>{
       const err=Math.abs(x-p.land); clear(); g.strokeStyle='#8a949c'; g.beginPath(); g.moveTo(0,Y); g.lineTo(W,Y); g.stroke();
       g.fillStyle='#4bd88a'; g.beginPath(); g.arc(p.land,Y,6,0,7); g.fill(); g.fillStyle='#2ed9ff'; g.beginPath(); g.arc(x,Y,6,0,7); g.fill();
       text(`${Math.round(err)} px`,(x+p.land)/2,Y+32,{s:16}); await sleep(1800);
       return {err, human:`${Math.round(err)} px from the landing spot`};
     });
   }},
 { id:'level', emoji:'📐', name:'Angle', sigma:8,
   intro:'Drag the handle to swing the line to the target angle (counterclockwise from the dashed horizontal). Release to lock it in.',
   make(r){ return {target:RI(r,5,355)}; },
   run(p){
     const cx=400, cy=250, L=185; let a=0, drag=false, last=0;
     const handle=()=>({x:cx+Math.cos(a*Math.PI/180)*L, y:cy-Math.sin(a*Math.PI/180)*L});
     const ang=pt=>(Math.atan2(-(pt.y-cy),pt.x-cx)*180/Math.PI+360)%360;
     const draw=()=>{ clear(); g.save(); g.setLineDash([6,6]); g.strokeStyle='#8a949c'; g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+230,cy); g.stroke(); g.restore();
       const h=handle(); g.strokeStyle='#2ed9ff'; g.lineWidth=4; g.beginPath(); g.moveTo(cx,cy); g.lineTo(h.x,h.y); g.stroke(); g.fillStyle='#0c1014'; g.lineWidth=2; g.beginPath(); g.arc(h.x,h.y,10,0,7); g.fill(); g.stroke();
       text(`match ${p.target}° counterclockwise`,400,44,{s:20}); text('drag the handle, release to lock',400,68,{s:13,c:'rgba(230,237,243,.55)'}); };
     draw();
     return new Promise(res=>{
       const down=e=>{ const q=toLogical(e), h=handle(); if(Math.hypot(q.x-h.x,q.y-h.y)<60){ drag=true; last=ang(q); cv.setPointerCapture(e.pointerId); } };
       const move=e=>{ if(!drag) return; const cur=ang(toLogical(e)); let d=cur-last; d=((d+540)%360)-180; a=((a+d)%360+360)%360; last=cur; draw(); };
       const up=async()=>{ if(!drag) return; drag=false; cv.removeEventListener('pointerdown',down); cv.removeEventListener('pointermove',move); cv.removeEventListener('pointerup',up);
         const diff=Math.abs(a-p.target), err=Math.min(diff,360-diff);
         draw(); const t=p.target*Math.PI/180; g.strokeStyle='#4bd88a'; g.lineWidth=2; g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(t)*L,cy-Math.sin(t)*L); g.stroke(); text(`${err.toFixed(1)}° off`,400,470,{s:18,c:'#2ed9ff'});
         await sleep(1600); res({err, human:`${err.toFixed(1)}° off target`}); };
       cv.addEventListener('pointerdown',down); cv.addEventListener('pointermove',move); cv.addEventListener('pointerup',up);
     });
   }},
 { id:'tempo', emoji:'🥁', name:'Tempo', sigma:60,
   intro:'Tap (click or press Space) along with the beat. After 4 on-beat taps the clicks stop. Keep the pulse going for 8 more beats.',
   make(r){ const bpm=RI(r,75,130); return {bpm,T:60000/bpm}; },
   run(p){
     return new Promise(res=>{
       const start=performance.now()+900, beats=[]; let next=start, stopped=false, stopAt=Infinity;
       const on=[], off=[]; let raf=0, finished=false;
       const tap=()=>{ if(finished) return; const t=performance.now();
         if(t<stopAt){ if(!beats.some(b=>Math.abs(t-b)<=p.T/3)) return; on.push(t); if(!stopped&&on.length>=4){ stopped=true; stopAt=beats[beats.length-1]+p.T/2; } }
         else { off.push(t); if(off.length>=8) fin(); } flash=t; };
       let flash=-1e9;
       const key=e=>{ if(e.code==='Space'&&!e.repeat){ e.preventDefault(); tap(); } };
       cv.addEventListener('pointerdown',tap); window.addEventListener('keydown',key);
       const fin=async()=>{ finished=true; cancelAnimationFrame(raf); cv.removeEventListener('pointerdown',tap); window.removeEventListener('keydown',key);
         // expected: continuing the grid from the last on-beat tap, aligned by average phase of the 4 on-beat taps
         const phase=on.map(t=>{ let best=1e9; for(const b of beats){ if(Math.abs(t-b)<Math.abs(best)) best=t-b; } return best; }).reduce((a,b)=>a+b,0)/on.length;
         const lastBeat=beats[beats.length-1];
         const errs=off.map((t,i)=>t-(lastBeat+phase+(i+1)*p.T));
         const m=errs.reduce((a,b)=>a+b,0)/errs.length, slip=Math.round(m/p.T), res2=errs.map(e=>e-slip*p.T);
         const mean=res2.reduce((a,b)=>a+b,0)/res2.length, drift=Math.abs(mean), jit=Math.sqrt(res2.reduce((a,b)=>a+(b-mean)**2,0)/res2.length);
         const e=.6*drift+.4*jit;
         clear(); text(`drift ${drift.toFixed(0)} ms · jitter ${jit.toFixed(0)} ms`,400,230,{s:21}); text(mean<0?'You rushed.':'You dragged.',400,270,{s:16,c:'rgba(230,237,243,.55)'});
         await sleep(2000); res({err:e, human:`${mean<0?'rushed':'dragged'} ${drift.toFixed(0)} ms · ±${jit.toFixed(0)} ms`}); };
       const loop=()=>{ if(finished) return; const now=performance.now();
         while(!stopped && next-now<400){ beats.push(next); if(audio) beep(audio.currentTime+(next-now)/1000); next+=p.T; }
         clear(); const inPlay=now<stopAt;
         if(inPlay){ let al=.15; for(let i=beats.length-1;i>=0;i--) if(beats[i]<=now){ al=Math.max(.15,1-(now-beats[i])/(p.T*.6)); break; }
           g.save(); g.globalAlpha=al; g.strokeStyle='#e6edf3'; g.lineWidth=3; g.beginPath(); g.arc(400,230,64,0,7); g.stroke(); g.restore();
           for(let i=0;i<4;i++){ const x=400-42+i*28; g.beginPath(); g.arc(x,330,6,0,7); if(i<on.length){ g.fillStyle='#2ed9ff'; g.fill(); } else { g.strokeStyle='rgba(230,237,243,.16)'; g.lineWidth=2; g.stroke(); } }
           text(now<start?'get ready':'tap along with the beat',400,380,{s:16,c:'rgba(230,237,243,.55)'}); }
         else { g.save(); g.globalAlpha=.1; g.strokeStyle='#e6edf3'; g.lineWidth=3; g.beginPath(); g.arc(400,230,64,0,7); g.stroke(); g.restore(); text('keep the beat going',400,380,{s:16,c:'rgba(230,237,243,.55)'}); text(`${8-off.length} left`,770,42,{s:14,a:'right',c:'rgba(230,237,243,.55)'}); }
         if(now-flash<150){ g.save(); g.globalAlpha=1-(now-flash)/150; g.fillStyle='#2ed9ff'; g.beginPath(); g.arc(400,230,8,0,7); g.fill(); g.restore(); }
         raf=requestAnimationFrame(loop); }; loop();
     });
   }},
 { id:'split', emoji:'✂️', name:'Split', sigma:.05,
   intro:'Mark the exact point a fraction of the way along the line from the stated end. Press, slide, release to lock it in.',
   make(r){ const fr=[[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[1,5],[4,5],[3,7],[5,8],[2,7],[5,6]]; const [n,d]=fr[RI(r,0,fr.length-1)]; const left=r()<.5; const x1=100,x2=700; return {n,d,left,x1,x2,target:left?x1+(n/d)*(x2-x1):x2-(n/d)*(x2-x1)}; },
   run(p){
     let pos=null, drag=false;
     const draw=()=>{ clear(); g.strokeStyle='#e6edf3'; g.lineWidth=3; g.beginPath(); g.moveTo(p.x1,250); g.lineTo(p.x2,250); g.stroke(); for(const x of [p.x1,p.x2]){ g.beginPath(); g.moveTo(x,241); g.lineTo(x,259); g.stroke(); }
       text(`${p.n}/${p.d} from the ${p.left?'left':'right'} end`,400,130,{s:22,c:'rgba(230,237,243,.55)'});
       if(pos!=null){ g.strokeStyle='#2ed9ff'; g.lineWidth=2.5; g.beginPath(); g.moveTo(pos,232); g.lineTo(pos,268); g.stroke(); }
       text('press, slide, release to lock',400,380,{s:13,c:'rgba(230,237,243,.55)'}); };
     draw();
     return new Promise(res=>{
       const cl=x=>Math.max(p.x1,Math.min(p.x2,x));
       const down=e=>{ drag=true; cv.setPointerCapture(e.pointerId); pos=cl(toLogical(e).x); draw(); };
       const move=e=>{ if(!drag) return; pos=cl(toLogical(e).x); draw(); };
       const up=async()=>{ if(!drag) return; drag=false; cv.removeEventListener('pointerdown',down); cv.removeEventListener('pointermove',move); cv.removeEventListener('pointerup',up);
         const err=Math.abs(pos-p.target)/(p.x2-p.x1); draw(); g.strokeStyle='#4bd88a'; g.lineWidth=2.5; g.beginPath(); g.moveTo(p.target,224); g.lineTo(p.target,276); g.stroke(); text(`${(err*100).toFixed(1)}% off`,400,320,{s:18,c:'#2ed9ff'});
         await sleep(2000); res({err, human:`${(err*100).toFixed(1)}% off the mark`}); };
       cv.addEventListener('pointerdown',down); cv.addEventListener('pointermove',move); cv.addEventListener('pointerup',up);
     });
   }},
];

// ---- flow ----
function card(step,tag,msg,btn){ return new Promise(res=>{ const c=el('div','card'); c.append(el('div','tag',step), el('h1','',tag), el('p','',msg)); const b=el('button','primary',btn); b.onclick=()=>{ if(!audio){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch{} } audio&&audio.resume(); res(); }; c.append(b); showScreen(c); b.focus(); }); }

async function playDay(key,record){
  const r=rng('perceptle:'+key), puzzles=events.map(ev=>ev.make(r)), results=[];
  for(let i=0;i<events.length;i++){
    const ev=events[i];
    await card(`EVENT ${i+1} OF 5`,`${ev.emoji} ${ev.name}`,ev.intro,'Ready');
    showStage(); clear(); say('');
    const out=await ev.run(puzzles[i]); const s=score(out.err,ev.sigma);
    say(`${s} pts · ${out.human}`); await sleep(900); say('');
    results.push({id:ev.id,score:s,grade:grade(s),human:out.human});
  }
  const total=Math.round(results.reduce((a,b)=>a+b.score,0)/results.length);
  const res={key,total,grade:grade(total),results};
  if(record) try{ localStorage.setItem('perceptle:'+key,JSON.stringify(res)); }catch{}
  return res;
}

function shareText(key,res){ return `Perceptle #${puzzleNo(key)} - ${res.grade} (${res.total})\n`+res.results.map((x,i)=>`${events[i].emoji} ${x.score}`).join('  '); }

function showResults(key,res,extra){
  const c=el('div','card'); c.append(el('div','tag',`PERCEPTLE #${puzzleNo(key)}`));
  const t=el('div','total',String(res.total)); t.append(el('small','',res.grade)); c.append(t);
  const rows=el('div'); res.results.forEach((x,i)=>{ const r=el('div','row'); r.append(el('span','',events[i].emoji), el('span','',events[i].name), el('span','h',x.human), el('span','',String(x.score)), el('span','',x.grade)); rows.append(r); }); c.append(rows);
  const bar=el('div');
  const share=el('button','primary','Share'); share.onclick=async()=>{ try{ await navigator.clipboard.writeText(shareText(key,res)); share.textContent='Copied'; }catch{ share.textContent='Copy failed'; } };
  const home=el('button','','Home'); home.onclick=home_;
  const prac=el('button','','Practice'); prac.onclick=async()=>{ const rr=await playDay('practice-'+Math.random().toString(36).slice(2),false); showResults(key,rr); };
  bar.append(share,prac,home); c.append(bar); if(extra) c.append(el('p','',extra)); showScreen(c);
}

function home_(){
  const key=dateKey(); $('no').textContent='#'+puzzleNo(key);
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('perceptle:'+key)); }catch{}
  if(saved){ showResults(key,saved,'Come back tomorrow for a new puzzle.'); return; }
  const c=el('div','card'); c.append(el('h1','','PERCEPTLE'), el('div','tag',`#${puzzleNo(key)} · ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}`), el('p','','Five tiny tests of perceptual instinct. Two minutes. One score.'));
  const b=el('button','primary','Play'); b.onclick=async()=>{ const res=await playDay(key,true); showResults(key,res,'Come back tomorrow for a new puzzle.'); };
  const pr=el('button','','Practice'); pr.onclick=async()=>{ const rr=await playDay('practice-'+Math.random().toString(36).slice(2),false); showResults(key,rr); };
  c.append(b,pr); showScreen(c); b.focus();
}
home_();
</script>
</body>
</html>
